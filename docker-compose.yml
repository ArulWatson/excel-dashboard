services:
  mysql:
    image: mysql:8.4
    container_name: exceldash-mysql
    environment:
      MYSQL_DATABASE: exceldash
      MYSQL_USER: exceldash
      MYSQL_PASSWORD: exceldash
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command: ["--default-authentication-plugin=mysql_native_password"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

